services:
  - type: web
    name: youtube-intel-backend
    env: python
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-intel-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: lm_studio
      - key: LM_STUDIO_API_BASE
        value: http://localhost:1234/v1

  - type: worker
    name: youtube-intel-crawler
    env: python
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: python scheduler/tasks.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-intel-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false

databases:
  - name: youtube-intel-db
    databaseName: youtube_intel
    user: youtube_user