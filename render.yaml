services:
  # ─── FastAPI 백엔드 API 서버 ─────────────────────────────────────────────
  - type: web
    name: youtube-intel-backend
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python -m playwright install chromium --with-deps || true
    startCommand: |
      alembic upgrade head &&
      python database/seed.py &&
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-intel-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: disabled

  # ─── 크롤러 + 랭킹 스케줄러 워커 (5분 주기, 상시 구동) ─────────────────────
