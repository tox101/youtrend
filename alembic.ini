# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = database/alembic

# template used to generate new migration files
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path pathlist to be prepended to the system path in env.py
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to associate with the "slug" in the migration filename
# truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate being used
# revision_environment = false

# set to 'true' to allow modules to be loaded that are layout-specific
# to the script directory, such as custom-formatted revision files
# sourceless = false

# version location specification; this defaults
# to database/alembic/versions.  When using multiple version
# directories, paths must be separated by spaces
# version_locations = database/alembic/versions

# the version_pattern property is used when defining version_locations
# version_pattern = *

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
